{% extends 'partials/layout/layout1.html' %}
{% load static %}
{% block content %}


<div class="rbt-dashboard-content">
    <div class="content-page">

        <!-- Text Generator -->
        <div class="chat-box-section">
            <div class="chat-top-bar">
                <div class="section-title">
                    <div class="icon">
                        <img src="{% static 'images/icons/document-file.png' %}" alt="">
                    </div>
                    <h6 class="title">New Conversation</h6>
                </div>
                <div class="dropdown history-box-dropdown">
                    <ul class="dropdown-menu style-one">
                        <li><a class="dropdown-item delete-item" href="#"><i class="fa-solid fa-trash-can"></i> Delete Chat</a></li>
                    </ul>
                </div>
            </div>
            <div class="chat-box-list" id="chatContainer">
                {% include 'tools/components/initial_chat.html' %}
            </div>

            <div class="rbt-static-bar">
                <form id="chatInput" class="new-chat-form border-gradient">
                    {% csrf_token %}
                    <textarea id="txtarea" name="chatMessage" rows="1" placeholder="Send a message..."></textarea>
                    <div class="left-icons">
                        <div title="AiWave" class="form-icon icon-gpt">
                            <img src="{% if bot_image and bot_image.value %}{% if bot_image.value|slice:':1' == '/' %}{{ bot_image.value }}{% else %}/media/{{ bot_image.value }}{% endif %}{% else %}{% static 'images/team/avater.png' %}{% endif %}"
                                 alt="Bot Image"
                                 class="w-10 h-10 rounded-full object-cover border border-gray-300 shadow-sm">
                        </div>
                    </div>
                    <div class="right-icons">
                        <button class="form-icon icon-send" id="sendButton" onclick="sendMessage(e)" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-custom-class="custom-tooltip" data-bs-title="Send message">
                            <i class="fa-sharp fa-solid fa-paper-plane-top"></i>
                        </button>
                    </div>
                </form>
                <p class="b3 small-text">AiWave can make mistakes. Consider checking important information.</p>
            </div>
        </div>
    </div>
</div>

<script>
window.BOT_MODE = "text-generator";
window.userProfilePic = "{{ user.profile.profile_picture.url|default:'' }}";
window.botImageUrl = `{% if bot_image and bot_image.value %}{% if bot_image.value|slice:':1' == '/' %}{{ bot_image.value }}{% else %}/media/{{ bot_image.value }}{% endif %}{% else %}{% static 'images/team/avater.png' %}{% endif %}`;

    document.addEventListener('DOMContentLoaded', function () {
        if (window.location.search.includes('prompt=')) {
            const url = new URL(window.location);
            url.searchParams.delete('prompt');
            window.history.replaceState({}, document.title, url.pathname + url.search);
        }

        // Render initial bot message as HTML (markdown)
        var botMsg = document.querySelector('.chat-box.ai-speech .chat-content p');
        if (botMsg && botMsg.textContent.includes('**')) {
            // Use marked.js if available, otherwise fallback to makeHumanReadable
            if (window.marked) {
                botMsg.innerHTML = marked.parse(botMsg.textContent);
            } else if (typeof makeHumanReadable === 'function') {
                botMsg.innerHTML = makeHumanReadable(botMsg.textContent);
            }
        }
    });
</script>



{% endblock content %}
